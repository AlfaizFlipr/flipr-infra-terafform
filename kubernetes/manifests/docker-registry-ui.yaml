apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry-ui
  namespace: fliprdev
  labels:
    app: docker-registry-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-registry-ui
  template:
    metadata:
      labels:
        app: docker-registry-ui
    spec:
      containers:
      - name: docker-registry-ui
        image: joxit/docker-registry-ui:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: NGINX_PROXY_PASS_URL
          value: "http://docker-registry.fliprdev.svc.cluster.local:5000"
        - name: REGISTRY_TITLE
          value: "Flipr Docker Registry"
        - name: SINGLE_REGISTRY
          value: "true"
        - name: DELETE_IMAGES
          value: "true"
        - name: SHOW_CONTENT_DIGEST
          value: "true"
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: docker-registry-ui
  namespace: fliprdev
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: docker-registry-ui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-registry-ui-ingress
  namespace: fliprdev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - registry-ui.init.flipr.ai
    secretName: flipr-wildcard-tls
  rules:
  - host: registry-ui.init.flipr.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docker-registry-ui
            port:
              number: 80
